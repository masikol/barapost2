[project]
name = "barapost2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ont_fast5_api==4.1.3",
    "pod5==0.3.23",
    "pyslow5==1.3.0",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
incremental = true
